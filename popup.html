<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<script type="text/javascript" src="market.js"></script>
<script type="text/javascript" src="popup.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans&display=swap');
    
    body {
        background-color: #fafafa;
        font-family: 'IBM Plex Mono', monospace;
    }
    
    span {
        font-size: 1.25em;
    }
    
    .inline-container {
        margin: 5px 0 10px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 240px;
    }
    
    #buy-quantity {
        margin: 10px;
        width: 35%;
    }
    
    #buy {
        display: block;
        margin: 0 auto 0 auto;
        cursor: pointer;
        font-family: inherit;
        text-align: center;
        font-weight: 700;
        border: none;
        background-image: linear-gradient(rgb(248, 209, 47) 0%, rgb(240, 185, 11) 100%);
        height: 30px;
        width: 140px;
        font-size: 1em;
    }
    
    #max {
        margin-left: 10px;
    }
    
    #maxspan {
        font-weight: 600;
        color: rgb(201, 148, 0);
        text-decoration: underline;
        cursor: pointer;
    }

.quantity-button {
    border: none;
    width: 40px;
    height: 40px;
    cursor: pointer;
    opacity: 1;
    border-radius: 32px;
    background: linear-gradient(rgb(248, 209, 47) 0%, rgb(240, 185, 11) 99.77%);
    justify-content: center;
    align-items: center;
}

</style>
    
<body>
    <p id="label"></p>
    <div class="inline-container">
        <div>
            <span id="quan-span">Quantity:</span> 

            <div class="inline-container">
                <button class="quantity-button">-</button>
                <input id='buy-quantity' type="number" name="quantity" value="0" min="0" disabled>
                <button class="quantity-button">+</button>
                <input type="checkbox" name="max" id="max"><label for="max"><span id="maxspan">Max</span></label>
            </div>
        </div>
    </div>
    <button id="buy">Start auto buy</button>
</body>
</html>
